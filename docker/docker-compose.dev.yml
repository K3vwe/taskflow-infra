services: 
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.dev
    image: tasktracker_frontend
    ports:
      - "3000:3000"
    volumes:
      - ../../frontend:/app
      - node_modules:/app/node_modules
    networks:
      - frontend_net
    environment:
      - NODE_ENV=development
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  backend:
    build: 
      context: ../../backend
      dockerfile: Dockerfile.dev
    image: tasktracker_backend
    env_file:
      - .env-dev
    ports: 
      - "8000:8000"
    volumes:
      - ../../backend:/app
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - backend_net
    volumes:
      - tasktracker_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

volumes:
  tasktracker_postgres_data:
  node_modules:

networks:
  backend_net:
  frontend_net: