services:
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.dev
    image: taskflow-web
    ports:
      - "3000:3000" 
    volumes:
      - ../../frontend:/app
      - node_modules:/app/node_modules
    env_file:
      - .env
    networks:
      - app-net

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.dev
    image: taskflow-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ../../backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net

  db:
    image: postgres:16
    env_file:
      - .env
    volumes:
      - tasktracker_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - app-net

  migration:
    image: taskflow-api
    command: alembic upgrade head
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net
        
volumes:
  tasktracker_postgres_data:
  node_modules:

networks:
  app-net:
    driver: bridge